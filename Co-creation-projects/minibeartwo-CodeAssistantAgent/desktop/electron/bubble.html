<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>CodeAssistantAgent · 桌面气泡</title>
    <link rel="stylesheet" href="./bubble.css" />
    <script src="./bubble.js" defer></script>
  </head>
  <body>
    <button
      id="bubble"
      class="bubble connecting"
      type="button"
      aria-label="打开代码助手，服务正在启动"
      aria-expanded="false"
      aria-busy="true"
      title="代码助手正在启动 · 点击打开 · 拖动移动 · 右键菜单"
    >
      <span class="bubble-orbit" aria-hidden="true"></span>
      <span class="bubble-mark" aria-hidden="true">CA</span>
      <span class="bubble-status" aria-hidden="true"></span>
    </button>
  </body>
</html>
